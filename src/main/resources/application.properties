spring.application.name=ApiPapas
server.port=${PORT:8081}

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:papasdb
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Nao adiciona em todos os endpoints os status do @RestControllerAdvice (cada endpoint documenta os seus)
springdoc.override-with-generic-response=false

# Chave mestra do administrador (gera e revoga as chaves de API). Defina API_ADMIN_KEY no Render.
# Se nao for definida, uma chave aleatoria e gerada a cada inicializacao e mostrada no log.
app.seguranca.admin-key=${API_ADMIN_KEY:}

# Considera os headers X-Forwarded-* do proxy do Render (IP real do cliente para o rate limiting,
# https nos links HATEOAS e no Swagger, e mesma origem para o CORS)
server.forward-headers-strategy=framework

# Rate limiting: requisicoes por janela, por chave de API (com chave) ou por IP (sem chave)
app.rate-limit.limite-anonimo=${RATE_LIMIT_ANONIMO:60}
app.rate-limit.limite-com-chave=${RATE_LIMIT_COM_CHAVE:120}
app.rate-limit.janela=${RATE_LIMIT_JANELA:60s}

# CORS: origens que podem chamar a API pelo navegador (separadas por virgula)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Paginacao: tamanho maximo de pagina aceito em ?size=
spring.data.web.pageable.max-page-size=100
