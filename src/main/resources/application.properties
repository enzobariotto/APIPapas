spring.application.name=ApiPapas
server.port=${PORT:8081}

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:papasdb
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Nao adiciona em todos os endpoints os status do @RestControllerAdvice (cada endpoint documenta os seus)
springdoc.override-with-generic-response=false
