spring.application.name=ApiPapas
server.port=${PORT:8081}

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:papasdb
# Console do H2: desligado por padrao, porque da acesso direto ao banco sem chave de API.
# Para usar localmente, defina a variavel de ambiente H2_CONSOLE=true (nunca no Render).
spring.h2.console.enabled=${H2_CONSOLE:false}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Nao adiciona em todos os endpoints os status do @RestControllerAdvice (cada endpoint documenta os seus)
springdoc.override-with-generic-response=false

# Chave mestra do administrador (gera e revoga as chaves de API). Defina API_ADMIN_KEY no Render.
# Se nao for definida, uma chave aleatoria e gerada a cada inicializacao e mostrada no log.
app.seguranca.admin-key=${API_ADMIN_KEY:}

# Considera os headers X-Forwarded-* do proxy do Render (https nos links HATEOAS e no Swagger, e mesma
# origem para o CORS). O rate limiting NAO usa o IP destes headers (ver app.rate-limit.header-ip).
server.forward-headers-strategy=framework

# Rate limiting (token bucket com Bucket4j): requisicoes por periodo, por chave de API (com chave)
# ou por IP (sem chave). As fichas voltam aos poucos ao longo do periodo (recarga gradual).
app.rate-limit.limite-anonimo=${RATE_LIMIT_ANONIMO:30}
app.rate-limit.limite-com-chave=${RATE_LIMIT_COM_CHAVE:60}
app.rate-limit.periodo=${RATE_LIMIT_PERIODO:60s}
# Header com o IP real do cliente. No Render (variavel RENDER=true, definida por ele) o padrao e CF-Connecting-IP,
# preenchido pelo Cloudflare; fora dele, vale o IP da conexao. Nunca usar X-Forwarded-For: o cliente pode falsifica-lo.
app.rate-limit.header-ip=${RATE_LIMIT_HEADER_IP:}

# CORS: origens que podem chamar a API pelo navegador (separadas por virgula)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Paginacao: tamanho maximo de pagina aceito em ?size=
spring.data.web.pageable.max-page-size=100

# Planos (por chave de API): preco mensal em reais, requisicoes por minuto e cota mensal (renova no dia 1o).
# O plano Gratuito usa o limite por minuto de app.rate-limit.limite-com-chave. O admin troca o plano de uma
# chave em PUT /chaves-api/{id}/plano.
app.planos.gratuito.cota-mensal=${PLANO_GRATUITO_COTA:3000}
app.planos.basico.preco=${PLANO_BASICO_PRECO:19.90}
app.planos.basico.por-minuto=${PLANO_BASICO_POR_MINUTO:120}
app.planos.basico.cota-mensal=${PLANO_BASICO_COTA:50000}
app.planos.pro.preco=${PLANO_PRO_PRECO:49.90}
app.planos.pro.por-minuto=${PLANO_PRO_POR_MINUTO:300}
app.planos.pro.cota-mensal=${PLANO_PRO_COTA:300000}
